<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vimeo Embed Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f8f9fa;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 20px; }
    label { display: block; font-weight: 500; margin-bottom: 6px; color: #374151; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,.2);
    }
    .toggles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .toggle:hover { border-color: #d1d5db; }
    .toggle.on { background: #eff6ff; border-color: #1a73e8; color: #1a73e8; }
    .toggle input { display: none; }
    .preview {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/10;
      margin-bottom: 20px;
    }
    .preview iframe { width: 100%; height: 100%; border: 0; display: block; }
    .preview-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9ca3af;
      font-size: 13px;
    }
    .code-section { position: relative; }
    .code-section label { margin-bottom: 8px; }
    .copy-btn {
      position: absolute;
      top: 0;
      right: 0;
      padding: 6px 12px;
      font-size: 12px;
      background: #1a73e8;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #1557b0; }
    .copy-btn.copied { background: #0d9488; }
    .code-block {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 14px 16px;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .code-block .tag { color: #569cd6; }
    .code-block .attr { color: #9cdcfe; }
    .code-block .str { color: #ce9178; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Vimeo Embed Tool</h1>
    <label for="video">Video URL or ID</label>
    <input type="text" id="video" placeholder="https://vimeo.com/1051366301 or 1051366301" value="1051366301" />

    <label>Toggles</label>
    <div class="toggles" id="toggles"></div>

    <label>Preview</label>
    <div class="preview" id="preview">
      <div class="preview-placeholder" id="placeholder">Enter a Vimeo URL or ID</div>
      <iframe id="iframe" style="display:none;"></iframe>
    </div>

    <div class="code-section">
      <label>Embed code</label>
      <button type="button" class="copy-btn" id="copyBtn" style="display:none;">Copy</button>
      <div class="code-block" id="code"></div>
    </div>
  </div>

  <script>
    const VIDEO_ID_REGEX = /(?:vimeo\.com\/(?:video\/)?|player\.vimeo\.com\/video\/)(\d+)(?:\?.*)?/i;

    const OPTIONS = [
      { key: 'badge', label: 'Badge', default: false },
      { key: 'autopause', label: 'Autopause', default: false },
      { key: 'autoplay', label: 'Autoplay', default: true },
      { key: 'loop', label: 'Loop', default: true },
      { key: 'muted', label: 'Muted', default: true },
      { key: 'controls', label: 'Controls', default: false },
      { key: 'fullscreen', label: 'Fullscreen', default: true },
      { key: 'byline', label: 'Byline', default: false },
      { key: 'title', label: 'Title', default: false },
      { key: 'portrait', label: 'Portrait', default: false },
    ];

    function parseVideoId(input) {
      if (!input || !input.trim()) return null;
      const trimmed = input.trim();
      const match = trimmed.match(VIDEO_ID_REGEX);
      if (match) return match[1];
      if (/^\d+$/.test(trimmed)) return trimmed;
      return null;
    }

    function buildSrc(videoId, state) {
      if (!videoId) return '';
      const base = `https://player.vimeo.com/video/${videoId}`;
      const params = new URLSearchParams();
      OPTIONS.forEach(({ key }) => {
        const v = state[key] ? '1' : '0';
        params.set(key, v);
      });
      return `${base}?${params.toString()}`;
    }

    function renderCode(src) {
      const el = document.getElementById('code');
      const copyBtn = document.getElementById('copyBtn');
      if (!src) { el.textContent = ''; copyBtn.style.display = 'none'; return; }
      const raw = `<iframe src="${src}" style="width:100%;height:100%;" width="1080" height="630" frameborder="0" allow="autoplay; picture-in-picture" allowfullscreen sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>`;
      el.textContent = raw;
      copyBtn.style.display = 'block';
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('code').textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      });
    });

    function update() {
      const input = document.getElementById('video').value;
      const videoId = parseVideoId(input);
      const iframe = document.getElementById('iframe');
      const placeholder = document.getElementById('placeholder');

      if (!videoId) {
        iframe.style.display = 'none';
        placeholder.style.display = 'flex';
        placeholder.textContent = 'Enter a Vimeo URL or ID';
        renderCode('');
        return;
      }

      const src = buildSrc(videoId, state);
      iframe.src = src;
      iframe.style.display = 'block';
      placeholder.style.display = 'none';
      renderCode(src);
    }

    const state = {};
    OPTIONS.forEach(o => { state[o.key] = o.default; });

    const togglesEl = document.getElementById('toggles');
    OPTIONS.forEach(({ key, label }) => {
      const div = document.createElement('div');
      div.className = 'toggle' + (state[key] ? ' on' : '');
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');
      div.innerHTML = `<input type="checkbox" id="t-${key}" ${state[key] ? 'checked' : ''} /><span>${label}</span>`;
      div.addEventListener('click', () => {
        state[key] = !state[key];
        div.classList.toggle('on', state[key]);
        div.querySelector('input').checked = state[key];
        update();
      });
      div.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); div.click(); } });
      togglesEl.appendChild(div);
    });

    document.getElementById('video').addEventListener('input', update);
    document.getElementById('video').addEventListener('paste', () => setTimeout(update, 0));

    update();
  </script>
</body>
</html>
