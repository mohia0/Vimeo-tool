<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vimeo Embed Editor — For Behance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #191919;
      --surface: #252525;
      --surface-2: #2e2e2e;
      --border: #3d3d3d;
      --border-focus: #0057ff;
      --text: #ffffff;
      --text-soft: #b3b3b3;
      --text-muted: #737373;
      --accent: #0057ff;
      --accent-hover: #3370ff;
      --accent-bg: rgba(0, 87, 255, 0.15);
      --radius: 8px;
      --radius-sm: 6px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header .vimeo-logo-img {
      height: 1.7em;
      width: auto;
      vertical-align: middle;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .header .header-sep {
      font-family: "Dancing Script", cursive;
      font-weight: 500;
      font-size: 1.15em;
      color: var(--text-muted);
      margin: 0 4px;
      vertical-align: middle;
    }

    .header .behance-logo-img {
      height: 1.35em;
      width: auto;
      vertical-align: middle;
      object-fit: contain;
      filter: invert(1);
    }

    .header p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: var(--text-soft);
      width: 100%;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .layout > aside.panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .layout > aside.panel .panel-head,
    .layout > aside.panel .input-wrap {
      flex-shrink: 0;
    }

    .layout > aside.panel .toggles-wrap {
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }

    .code-section {
      margin-top: 24px;
      width: 100%;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 12px 16px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .input-wrap {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap input::placeholder {
      color: var(--text-muted);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-bg);
    }

    .toggles-wrap {
      padding: 8px 12px 10px;
      display: flex;
      gap: 0;
      align-items: center;
      flex-wrap: nowrap;
    }

    .toggles-side {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .options-sep {
      width: 1px;
      height: 38px;
      flex-shrink: 0;
      background: var(--border);
      margin: 0 25px;
    }

    .toggles-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .toggle:hover {
      background: var(--border);
      color: var(--text);
    }

    .toggle.on {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .toggle .icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .size-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      min-width: 0;
    }

    .size-controls .size-header {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .size-controls label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .lock-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .lock-btn:hover {
      color: var(--text);
      border-color: var(--border);
    }

    .lock-btn.on {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .lock-btn svg {
      width: 11px;
      height: 11px;
    }

    .size-fields {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .size-fields .size-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .size-fields .size-group label {
      font-size: 0.6rem;
      width: 16px;
    }

    .size-fields input {
      width: 56px;
      min-width: 56px;
      padding: 4px 5px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-sizing: border-box;
    }

    .size-fields input::-webkit-outer-spin-button,
    .size-fields input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .size-fields input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .size-fields input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .reset-size-btn {
      width: 18px;
      height: 18px;
      padding: 0;
      margin-left: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .reset-size-btn:hover {
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .reset-size-btn svg {
      width: 10px;
      height: 10px;
    }

    .input-error {
      font-size: 0.7rem;
      color: #f87171;
      margin-top: 6px;
      display: none;
    }

    .input-error.visible {
      display: block;
    }

    .input-wrap.has-error input {
      border-color: #f87171;
    }

    .preview-loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .preview.loading .preview-loading {
      display: flex;
    }

    .preview.loading .preview-placeholder {
      display: none;
    }

    .size-code-toggle {
      padding: 3px 6px;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .size-code-toggle:hover {
      color: var(--text);
    }

    .size-code-toggle.on {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .toggle.on .icon {
      opacity: 1;
    }

    .toggle .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .preview-wrap {
      padding: 0;
      background: #0a0a0a;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .actual-size-btn {
      padding: 6px 12px;
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .actual-size-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .actual-size-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .actual-size-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .actual-size-modal.open {
      display: flex;
    }

    .actual-size-modal .modal-inner {
      position: relative;
      max-width: 100%;
      max-height: calc(100vh - 80px);
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .actual-size-modal .modal-inner iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .actual-size-modal .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .actual-size-modal .modal-close:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .actual-size-modal .modal-close svg {
      width: 16px;
      height: 16px;
    }

    .preview {
      aspect-ratio: 16/9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .preview.empty .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 24px;
      text-align: center;
    }

    .preview:not(.empty) .preview-placeholder {
      display: none;
    }

    .preview-placeholder svg {
      width: 48px;
      height: 48px;
      opacity: 0.4;
    }

    .preview iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .preview.empty iframe {
      display: none;
    }

    .code-wrap {
      padding: 0;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .code-header span {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .copy-btn {
      padding: 6px 12px;
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .copy-btn.copied {
      background: #0a0;
      border-color: #0a0;
      color: #fff;
    }

    .code-block {
      padding: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #ffffff;
      background: #0d0d0d;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 80px;
    }

    .code-block:empty::before {
      content: "Embed code will appear here once you add a video.";
      color: var(--text-muted);
    }

    .app-footer {
      margin-top: 80px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .app-footer a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
    }

    .app-footer a:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-title-wrap">
        <img class="vimeo-logo-img" src="vimeo-logo.svg" alt="Vimeo" width="80" height="24">
        <h1>Embed Tool</h1>
        <span class="header-sep">for</span>
        <img class="behance-logo-img" src="Behance_logo.svg.png" alt="Behance" width="120" height="32">
      </div>
      <p>Paste a link or ID, toggle options, and copy the embed code.</p>
    </header>

    <div class="layout">
      <aside class="panel">
        <div class="panel-head">Video</div>
        <div class="input-wrap" id="inputWrap">
          <input type="text" id="input" placeholder="https://vimeo.com/1051366301 or 1051366301" autocomplete="off" aria-describedby="inputError">
          <p class="input-error" id="inputError" role="alert">Enter a valid Vimeo URL or video ID.</p>
        </div>
        <div class="panel-head">Options</div>
        <div class="toggles-wrap">
          <div class="toggles-side" id="toggles"></div>
          <div class="options-sep" aria-hidden="true"></div>
          <div class="size-controls">
            <div class="size-header">
              <button type="button" class="lock-btn on" id="lockAspectBtn" title="Lock 16:9 aspect ratio" aria-pressed="true">
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V7a5 5 0 0110 0v4M5 11h14a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1v-7a1 1 0 011-1z"/></svg>
                <svg class="unlock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a1 1 0 001-1v-7a1 1 0 00-1-1H5a1 1 0 00-1 1v7a1 1 0 001 1z"/></svg>
              </button>
              <label>Lock</label>
              <button type="button" class="reset-size-btn" id="resetSizeBtn" title="Reset size to 1080×630" aria-label="Reset size">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
              </button>
            </div>
            <div class="size-fields">
              <div class="size-group">
                <label for="embedWidth">W</label>
                <input type="number" id="embedWidth" min="320" max="3840" step="1" value="1080">
              </div>
              <span style="color:var(--text-muted);font-size:10px;">×</span>
              <div class="size-group">
                <label for="embedHeight">H</label>
                <input type="number" id="embedHeight" min="180" max="2160" step="1" value="630">
              </div>
            </div>
            <button type="button" class="size-code-toggle on" id="sizeInCodeBtn" title="Include width & height in embed code (off = responsive 100%)">In code</button>
          </div>
        </div>
      </aside>

      <main>
        <div class="panel preview-wrap">
          <div class="panel-head preview-head">
            <span>Preview</span>
            <button type="button" class="actual-size-btn" id="actualSizeBtn" disabled title="View at actual size">Actual size</button>
          </div>
          <div class="preview" id="preview">
            <div class="preview-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              <span class="placeholder-text">Add a Vimeo URL or video ID</span>
            </div>
            <div class="preview-loading" aria-live="polite">Loading…</div>
            <iframe id="previewIframe" style="display:none;"></iframe>
          </div>
        </div>
      </main>
    </div>

    <div class="code-section">
      <div class="panel code-wrap">
        <div class="code-header">
          <span>Embed code</span>
          <button type="button" class="copy-btn" id="copyBtn">Copy</button>
        </div>
        <pre class="code-block" id="code"></pre>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Made with love by <a href="https://mohihassan.com" target="_blank" rel="noopener noreferrer" class="footer-name">MOHI HASSAN</a>
  </footer>

  <div class="actual-size-modal" id="actualSizeModal" aria-hidden="true">
    <div class="modal-inner" id="actualSizeModalInner">
      <iframe id="actualSizeIframe" title="Video at actual size"></iframe>
      <button type="button" class="modal-close" id="actualSizeClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <script>
    const ICONS = {
      autoplay: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>',
      loop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>',
      muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',
      controls: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M8 9v6M12 9v6M16 9v6"/></svg>',
      fullscreen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>',
    };

    const OPTIONS = [
      { key: 'autoplay', label: 'Autoplay' },
      { key: 'loop', label: 'Loop' },
      { key: 'muted', label: 'Muted' },
      { key: 'controls', label: 'Controls' },
      { key: 'fullscreen', label: 'Fullscreen' },
    ];

    const state = { videoId: '', hash: '', options: {}, width: 1080, height: 630, lockAspect: true, includeSizeInCode: true };
    OPTIONS.forEach(o => { state.options[o.key] = false; });
    state.options.autoplay = true;
    state.options.loop = true;
    state.options.muted = true;
    state.options.controls = false;
    state.options.fullscreen = true;

    const MIN_W = 320, MAX_W = 3840, MIN_H = 180, MAX_H = 2160;
    const RATIO = 16 / 9;
    function clampWidth(v) { return Math.min(MAX_W, Math.max(MIN_W, parseInt(v, 10) || MIN_W)); }
    function clampHeight(v) { return Math.min(MAX_H, Math.max(MIN_H, parseInt(v, 10) || MIN_H)); }
    function heightFromWidth(w) { return clampHeight(Math.round(w / RATIO)); }
    function widthFromHeight(h) { return clampWidth(Math.round(h * RATIO)); }

    function parseInput(val) {
      val = (val || '').trim();
      if (!val) return { videoId: '', hash: '' };
      let videoId = '';
      let hash = '';
      if (/^\d+$/.test(val)) {
        videoId = val;
      } else {
        try {
          const u = new URL(val.startsWith('http') ? val : 'https://vimeo.com/' + val);
          const path = u.pathname.replace(/\/$/, '');
          const m = path.match(/\/video\/(\d+)/) || path.match(/\/(\d+)/);
          if (m) videoId = m[1];
          hash = u.searchParams.get('h') || '';
        } catch (_) {
          const m = val.match(/(?:video\/)?(\d+)/);
          if (m) videoId = m[1];
        }
      }
      return { videoId, hash };
    }

    function buildSrc() {
      if (!state.videoId) return '';
      const base = 'https://player.vimeo.com/video/' + state.videoId;
      const params = new URLSearchParams();
      OPTIONS.forEach(({ key }) => {
        params.set(key, state.options[key] ? '1' : '0');
      });
      if (state.hash) params.set('h', state.hash);
      return base + '?' + params.toString();
    }

    function buildIframeTag() {
      const src = buildSrc();
      if (!src) return '';
      const allow = 'autoplay; picture-in-picture; fullscreen';
      if (state.includeSizeInCode) {
        return `<iframe src="${src}" width="${state.width}" height="${state.height}" frameborder="0" allow="${allow}" allowfullscreen></iframe>`;
      }
      return `<iframe src="${src}" style="width:100%;height:100%;" frameborder="0" allow="${allow}" allowfullscreen></iframe>`;
    }

    function render() {
      const preview = document.getElementById('preview');
      const iframe = document.getElementById('previewIframe');
      const codeEl = document.getElementById('code');
      const actualSizeBtn = document.getElementById('actualSizeBtn');
      const src = buildSrc();

      if (!state.videoId) {
        preview.classList.add('empty');
        preview.classList.remove('loading');
        iframe.style.display = 'none';
        iframe.removeAttribute('src');
        codeEl.textContent = '';
        if (actualSizeBtn) {
          actualSizeBtn.disabled = true;
          actualSizeBtn.textContent = 'Actual size';
        }
        return;
      }

      preview.classList.remove('empty');
      preview.classList.add('loading');
      iframe.style.display = 'none';
      iframe.removeAttribute('src');
      codeEl.textContent = buildIframeTag();
      if (actualSizeBtn) {
        actualSizeBtn.disabled = false;
        actualSizeBtn.textContent = 'Actual size (' + state.width + '×' + state.height + ')';
        actualSizeBtn.title = 'View at ' + state.width + '×' + state.height;
      }
      iframe.onload = function() {
        preview.classList.remove('loading');
        iframe.style.display = 'block';
        iframe.onload = null;
      };
      iframe.onerror = function() {
        preview.classList.remove('loading');
        iframe.style.display = 'block';
      };
      iframe.src = src;
    }

    function setupToggles() {
      const container = document.getElementById('toggles');
      const row1 = document.createElement('div');
      row1.className = 'toggles-row';
      const row2 = document.createElement('div');
      row2.className = 'toggles-row';
      const r1 = ['autoplay', 'loop', 'muted'];
      const r2 = ['controls', 'fullscreen'];
      OPTIONS.forEach(({ key, label }) => {
        const row = r1.includes(key) ? row1 : row2;
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'toggle' + (state.options[key] ? ' on' : '');
        el.innerHTML = '<span class="icon">' + (ICONS[key] || '') + '</span><span>' + label + '</span>';
        el.addEventListener('click', () => {
          state.options[key] = !state.options[key];
          el.classList.toggle('on', state.options[key]);
          render();
        });
        row.appendChild(el);
      });
      container.appendChild(row1);
      container.appendChild(row2);
    }

    const inputEl = document.getElementById('input');
    const inputWrap = document.getElementById('inputWrap');
    const inputError = document.getElementById('inputError');

    inputEl.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      const { videoId, hash } = parseInput(val);
      state.videoId = videoId;
      state.hash = hash;
      if (val && !videoId) {
        inputWrap.classList.add('has-error');
        inputError.classList.add('visible');
      } else {
        inputWrap.classList.remove('has-error');
        inputError.classList.remove('visible');
      }
      render();
    });

    const embedWidthEl = document.getElementById('embedWidth');
    const embedHeightEl = document.getElementById('embedHeight');
    const lockAspectBtn = document.getElementById('lockAspectBtn');

    function syncSizeFromInputs() {
      if (state.lockAspect) {
        const w = clampWidth(embedWidthEl.value);
        state.width = w;
        state.height = heightFromWidth(w);
        embedWidthEl.value = state.width;
        embedHeightEl.value = state.height;
      } else {
        state.width = clampWidth(embedWidthEl.value);
        state.height = clampHeight(embedHeightEl.value);
        embedWidthEl.value = state.width;
        embedHeightEl.value = state.height;
      }
      render();
    }

    if (embedWidthEl) {
      embedWidthEl.addEventListener('input', () => {
        const w = clampWidth(embedWidthEl.value);
        state.width = w;
        if (state.lockAspect) {
          state.height = heightFromWidth(w);
          if (embedHeightEl) embedHeightEl.value = state.height;
        }
        render();
      });
      embedWidthEl.addEventListener('change', () => {
        state.width = clampWidth(embedWidthEl.value);
        embedWidthEl.value = state.width;
        if (state.lockAspect) {
          state.height = heightFromWidth(state.width);
          if (embedHeightEl) embedHeightEl.value = state.height;
        }
        render();
      });
    }
    if (embedHeightEl) {
      embedHeightEl.addEventListener('input', () => {
        const h = clampHeight(embedHeightEl.value);
        state.height = h;
        if (state.lockAspect) {
          state.width = widthFromHeight(h);
          if (embedWidthEl) embedWidthEl.value = state.width;
        }
        render();
      });
      embedHeightEl.addEventListener('change', () => {
        state.height = clampHeight(embedHeightEl.value);
        embedHeightEl.value = state.height;
        if (state.lockAspect) {
          state.width = widthFromHeight(state.height);
          if (embedWidthEl) embedWidthEl.value = state.width;
        }
        render();
      });
    }

    if (lockAspectBtn) {
      lockAspectBtn.addEventListener('click', () => {
        state.lockAspect = !state.lockAspect;
        lockAspectBtn.classList.toggle('on', state.lockAspect);
        lockAspectBtn.setAttribute('aria-pressed', state.lockAspect);
        const lockIcon = lockAspectBtn.querySelector('.lock-icon');
        const unlockIcon = lockAspectBtn.querySelector('.unlock-icon');
        if (lockIcon && unlockIcon) {
          lockIcon.style.display = state.lockAspect ? '' : 'none';
          unlockIcon.style.display = state.lockAspect ? 'none' : '';
        }
        lockAspectBtn.title = state.lockAspect ? 'Lock 16:9 aspect ratio' : 'Unlock aspect ratio';
        render();
      });
    }

    const resetSizeBtn = document.getElementById('resetSizeBtn');
    if (resetSizeBtn) {
      resetSizeBtn.addEventListener('click', () => {
        state.width = 1080;
        state.height = 630;
        state.lockAspect = true;
        if (embedWidthEl) embedWidthEl.value = state.width;
        if (embedHeightEl) embedHeightEl.value = state.height;
        if (lockAspectBtn) {
          lockAspectBtn.classList.add('on');
          lockAspectBtn.setAttribute('aria-pressed', 'true');
          const lockIcon = lockAspectBtn.querySelector('.lock-icon');
          const unlockIcon = lockAspectBtn.querySelector('.unlock-icon');
          if (lockIcon) lockIcon.style.display = '';
          if (unlockIcon) unlockIcon.style.display = 'none';
          lockAspectBtn.title = 'Lock 16:9 aspect ratio';
        }
        render();
      });
    }

    const sizeInCodeBtn = document.getElementById('sizeInCodeBtn');
    if (sizeInCodeBtn) {
      sizeInCodeBtn.addEventListener('click', () => {
        state.includeSizeInCode = !state.includeSizeInCode;
        sizeInCodeBtn.classList.toggle('on', state.includeSizeInCode);
        sizeInCodeBtn.title = state.includeSizeInCode ? 'Include width & height in embed code (off = responsive 100%)' : 'Responsive embed (100% size in code)';
        render();
      });
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      const code = document.getElementById('code').textContent;
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    });

    const actualSizeBtn = document.getElementById('actualSizeBtn');
    const actualSizeModal = document.getElementById('actualSizeModal');
    const actualSizeModalInner = document.getElementById('actualSizeModalInner');
    const actualSizeIframe = document.getElementById('actualSizeIframe');
    const actualSizeClose = document.getElementById('actualSizeClose');

    if (actualSizeBtn) {
      actualSizeBtn.addEventListener('click', () => {
        const src = buildSrc();
        if (!src) return;
        actualSizeIframe.src = src;
        if (actualSizeModalInner) {
          actualSizeModalInner.style.width = state.width + 'px';
          actualSizeModalInner.style.height = state.height + 'px';
        }
        actualSizeModal.classList.add('open');
        actualSizeModal.setAttribute('aria-hidden', 'false');
      });
    }

    if (actualSizeClose) {
      actualSizeClose.addEventListener('click', () => {
        actualSizeModal.classList.remove('open');
        actualSizeModal.setAttribute('aria-hidden', 'true');
        actualSizeIframe.removeAttribute('src');
      });
    }

    if (actualSizeModal) {
      actualSizeModal.addEventListener('click', (e) => {
        if (e.target === actualSizeModal) {
          actualSizeModal.classList.remove('open');
          actualSizeModal.setAttribute('aria-hidden', 'true');
          actualSizeIframe.removeAttribute('src');
        }
      });
    }

    setupToggles();
    render();
  </script>
</body>
</html>
